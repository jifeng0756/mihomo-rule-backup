name: Sync Mihomo Fake-IP Rules

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download latest rules
        run: |
          set -e

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/qichiyuhub/rule/refs/heads/main/rules/fakeipfilter-cn.list" \
            -o fakeipfilter-cn.list

          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/qichiyuhub/rule/refs/heads/main/rules/fakeipfilter-!cn.list" \
            -o "fakeipfilter-!cn.list"

          test -s fakeipfilter-cn.list
          test -s "fakeipfilter-!cn.list"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add fakeipfilter-cn.list "fakeipfilter-!cn.list"

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update Fake-IP filter rules"
          git push
